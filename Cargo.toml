[package]
name = "activate"
version = "0.1.0"
edition = "2021"

[lib]
name = "activate"
path = "src/lib.rs"

[[bin]]
name = "activate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive", "env"] }
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"
directories = "6.0.0"
anyhow = "1.0.100"
chrono = { version = "0.4.39", features = ["serde"] }
path-clean = "1.0.1"
colored = "3.1.1"
tabled = "0.18.0"
serde_json = "1.0.137"
fuzzy-matcher = "0.3"
walkdir = "2.5"
atty = "0.2"

[dev-dependencies]
tempfile = "3.8"
